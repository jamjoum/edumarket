name: EduMarket – CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ${{ github.repository }}/edumarket-backend
  IMAGE_FRONTEND: ${{ github.repository }}/edumarket-frontend

jobs:

  # ═══════════════════════════════════════════════════════════════════
  # Job 1 – Backend (Java 21 + Spring Boot)
  # ═══════════════════════════════════════════════════════════════════
  backend-ci:
    name: 🔧 Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       edumarket_test
          POSTGRES_USER:     edumarket
          POSTGRES_PASSWORD: edumarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 📦 Build & Test
        run: mvn clean verify --no-transfer-progress
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: edumarket_test
          DB_USER: edumarket
          DB_PASS: edumarket

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          flags: backend

      - name: 🐳 Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }} .

  # ═══════════════════════════════════════════════════════════════════
  # Job 2 – Frontend (Angular 17)
  # ═══════════════════════════════════════════════════════════════════
  frontend-ci:
    name: 🎨 Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint --if-present

      - name: 🧪 Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --if-present

      - name: 🏗️ Build production
        run: npm run build

      - name: 🐳 Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }} .

  # ═══════════════════════════════════════════════════════════════════
  # Job 3 – Docker Compose Integration Test
  # ═══════════════════════════════════════════════════════════════════
  integration:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Docker Compose up
        run: docker compose up -d --build

      - name: ⏳ Wait for services
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'
          timeout 30  bash -c 'until curl -sf http://localhost:4200; do sleep 3; done'

      - name: 🔍 Smoke tests
        run: |
          curl -sf http://localhost:8080/api/v1/courses | jq 'length'
          curl -sf http://localhost:8080/actuator/health | jq '.status'
          echo "✅ Smoke tests passed"

      - name: 🧹 Cleanup
        if: always()
        run: docker compose down -v

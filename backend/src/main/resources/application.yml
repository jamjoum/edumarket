spring:
  application:
    name: edumarket-backend

  # ── Virtual Threads (Java 21) ──────────────────────────────────────────────
  threads:
    virtual:
      enabled: true   # Activer les Virtual Threads de Project Loom

  # ── Datasource ────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edumarket}
    username: ${DB_USER:edumarket}
    password: ${DB_PASS:edumarket}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway gère le schéma
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Security (désactivé en dev pour Swagger) ──────────────────────────────
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASS:admin123}

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── App custom properties ─────────────────────────────────────────────────
edumarket:
  payment:
    default-provider: credit-card   # credit-card | paypal | crypto
  subscription:
    trial-days: 14
    monthly-price: 19.99
    yearly-price: 149.99

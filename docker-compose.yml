# ═══════════════════════════════════════════════════════════════════════════
# docker-compose.yml – Stack EduMarket complète
# ═══════════════════════════════════════════════════════════════════════════
#
#   Services :
#     • postgres   → Base de données PostgreSQL 16
#     • backend    → Spring Boot 3 / Java 21 (Virtual Threads)
#     • frontend   → Angular 17 / Nginx
#
#   Lancement :
#     docker compose up --build
#
#   Accès :
#     Frontend  → http://localhost:4200
#     API       → http://localhost:8080/api/v1
#     Swagger   → http://localhost:8080/swagger-ui.html
#     PGAdmin   → http://localhost:5050 (si profil tools activé)
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edumarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       edumarket
      POSTGRES_USER:     edumarket
      POSTGRES_PASSWORD: edumarket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumarket -d edumarket"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edumarket-net

  # ── Backend Spring Boot ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edumarket-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Datasource
      DB_HOST:    postgres
      DB_PORT:    5432
      DB_NAME:    edumarket
      DB_USER:    edumarket
      DB_PASS:    edumarket
      # Server
      SERVER_PORT: 8080
      # Admin UI
      ADMIN_USER: admin
      ADMIN_PASS: admin123
      # Spring profiles
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - edumarket-net
    labels:
      com.edumarket.service: backend
      com.edumarket.version: "1.0.0"

  # ── Frontend Angular / Nginx ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edumarket-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - edumarket-net
    labels:
      com.edumarket.service: frontend

  # ── PGAdmin (optionnel, profil "tools") ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edumarket-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@edumarket.io
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - edumarket-net

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: edumarket-postgres-data

# ── Réseau interne ───────────────────────────────────────────────────────────
networks:
  edumarket-net:
    name: edumarket-network
    driver: bridge
